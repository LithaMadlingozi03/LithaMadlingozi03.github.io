<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Average engagement rate by content format</title><desc id="desc">Carousel 8.50 percent, Video 8.21 percent, Image 7.25 percent, from eight fictional posts.</desc>
<rect width="900" height="500" rx="20" fill="#ffffff"/><text x="50" y="55" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18212f">Average engagement rate by format</text><text x="50" y="82" font-family="Arial,sans-serif" font-size="14" fill="#667085">Eight fictional posts · directional results only</text>
<g stroke="#e4e7ec" stroke-width="1"><line x1="105" y1="360" x2="830" y2="360"/><line x1="105" y1="300" x2="830" y2="300"/><line x1="105" y1="240" x2="830" y2="240"/><line x1="105" y1="180" x2="830" y2="180"/><line x1="105" y1="120" x2="830" y2="120"/></g>
<g font-family="Arial,sans-serif" font-size="13" fill="#667085" text-anchor="end"><text x="90" y="365">0%</text><text x="90" y="305">2%</text><text x="90" y="245">4%</text><text x="90" y="185">6%</text><text x="90" y="125">8%</text></g>
