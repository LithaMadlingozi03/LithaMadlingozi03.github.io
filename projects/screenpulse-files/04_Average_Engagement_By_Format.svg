<g font-family="Arial,sans-serif" font-size="16" fill="#344054" text-anchor="middle"><text x="250" y="392">Carousel</text><text x="480" y="392">Video</text><text x="710" y="392">Image</text></g>
<text x="50" y="456" font-family="Arial,sans-serif" font-size="13" fill="#667085">Caution: sample size is 8 posts; the comparison does not establish causation.</text></svg>